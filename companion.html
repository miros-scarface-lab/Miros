<!DOCTYPE html>
<html lang="en" data-theme="vintage-parchment">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Companion | Mir A K Sajid</title>
  <meta name="description" content="Intelligent AI Companion for systems engineering, programming, and academic problem solving.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,300..800;1,300..800&family=Outfit:wght@300..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="assets/images/avatar-pixel.png">
</head>
<body class="vintage-body companion-body-page">

  <div class="vintage-overlay" id="vintageOverlay" aria-hidden="true"></div>

  <!-- Slim Universal Header -->
  <header class="vintage-header" id="header">
    <div class="header-container">
      <div class="brand-badge">
        <a href="index.html" class="brand-link">
          <span class="brand-bracket">[</span>
          <span class="brand-text" id="headerBrand">CSE://SAJID</span>
          <span class="brand-bracket">]</span>
        </a>
      </div>

      <nav class="nav-links" id="mainNav">
        <a href="index.html" class="nav-item"><span>00.</span> Home</a>
        <a href="about.html" class="nav-item"><span>01.</span> About</a>
        <a href="terminal.html" class="nav-item"><span>02.</span> Terminal</a>
        <a href="projects.html" class="nav-item"><span>03.</span> Projects</a>
        <a href="skills.html" class="nav-item"><span>04.</span> Skills</a>
        <a href="academics.html" class="nav-item"><span>05.</span> Academics</a>
        <a href="experience.html" class="nav-item"><span>06.</span> Experience</a>
        <a href="contact.html" class="nav-item"><span>07.</span> Dispatch</a>
        <a href="hsc.html" class="nav-item"><span>08.</span> HSC Academic</a>
        <a href="companion.html" class="nav-item active"><span>09.</span> Companion</a>
      </nav>

      <div class="header-controls">
        <div class="theme-dropdown">
          <button class="vintage-btn btn-sm btn-icon" id="themeDropdownBtn" title="Switch Theme">
            <span class="btn-icon-symbol">🗲</span>
            <span class="theme-active-name" id="themeActiveName">Theme</span>
          </button>
          <div class="dropdown-menu" id="themeMenu">
            <button class="theme-option active" data-theme-val="vintage-parchment">📜 Parchment &amp; Ink</button>
            <button class="theme-option" data-theme-val="terminal-phosphor">📟 CRT Green Phosphor</button>
            <button class="theme-option" data-theme-val="blueprint-cyan">📐 Blueprint Cyan</button>
            <button class="theme-option" data-theme-val="amber-crt">💡 Amber Gas Discharge</button>
            <button class="theme-option" data-theme-val="cyber-deck">💜 Cyberdeck Neon</button>
            <button class="theme-option" data-theme-val="solarized-dark">☀️ Solarized Dark</button>
          </div>
        </div>

        <button class="vintage-btn btn-sm btn-icon" id="audioToggleBtn" title="Toggle Audio">
          <span id="audioIcon">🔊</span>
        </button>
      </div>

      <button class="mobile-toggle" id="mobileMenuToggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- Main Companion Viewport Container -->
  <main class="companion-viewport-container" id="companionContainer">

    <!-- Passphrase Lock Screen (Active by Default until 'miros' entered) -->
    <div class="companion-lock-screen" id="companionLockScreen">
      <div class="companion-lock-card parchment-paper">
        <div class="lock-shield-icon">🔒</div>
        <h2 class="lock-shield-title">Access Restricted</h2>
        <p class="lock-shield-desc">Enter passphrase to access the companion workspace.</p>
        <form id="companionLockForm" class="companion-lock-form">
          <div class="lock-input-wrap">
            <input type="password" id="companionPasscodeInput" class="vintage-input lock-passcode-input" placeholder="Enter passphrase..." required autofocus autocomplete="current-password">
            <button type="submit" class="vintage-btn btn-primary lock-submit-btn">Unlock</button>
          </div>
          <div class="companion-lock-feedback" id="companionLockFeedback"></div>
        </form>
      </div>
    </div>

    <!-- Modern Clean Chat Workspace (Revealed Upon Unlock) -->
    <div class="companion-workspace-wrapper" id="companionWorkspace" style="display: none;">
      
      <!-- Clean Chat Window -->
      <div class="modern-chat-window parchment-paper">
        
        <!-- Chat Header with Model Nickname, Avatar & 3-Dot Settings Menu -->
        <div class="modern-chat-header">
          <div class="chat-header-identity">
            <img class="chat-header-avatar" id="companionHeaderAvatar" src="assets/images/avatar-pixel.png" alt="Avatar">
            <div class="chat-header-info">
              <span class="chat-header-name" id="companionHeaderNickname">Nova</span>
              <span class="chat-header-status">
                <span class="status-green-dot"></span> Active
              </span>
            </div>
          </div>

          <div class="chat-header-actions">
            <!-- 3-Dot Chat Settings Menu Button -->
            <button type="button" class="modern-dots-btn" id="companionDotsBtn" title="Customize Nickname, Avatar, Model & Personality" aria-label="Settings">
              <span>⋮</span>
            </button>
          </div>
        </div>

        <!-- Chat Messages Feed (No Gemini Branding) -->
        <div class="modern-chat-feed" id="companionChatFeed">
          <!-- Rendered dynamically -->
        </div>

        <!-- Modern Floating Chatbar Deck -->
        <div class="modern-chatbar-deck">
          <div class="modern-chatbar">
            <textarea class="modern-chatbar-input" id="companionInput" rows="1" placeholder="Message Nova..." spellcheck="false"></textarea>
            <button type="button" class="modern-send-btn" id="companionSendBtn" title="Send message" aria-label="Send">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </button>
          </div>
        </div>

      </div>

    </div>

  </main>

  <script src="companion-engine.js"></script>
  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.CompanionEngine && window.CompanionEngine.GeminiCompanion) {
        window.activeCompanion = new window.CompanionEngine.GeminiCompanion({
          container: document.getElementById('companionContainer'),
          lockScreenEl: document.getElementById('companionLockScreen'),
          workspaceEl: document.getElementById('companionWorkspace'),
          messagesContainer: document.getElementById('companionChatFeed'),
          inputEl: document.getElementById('companionInput'),
          sendBtn: document.getElementById('companionSendBtn'),
          nicknameEl: document.getElementById('companionHeaderNickname'),
          avatarEl: document.getElementById('companionHeaderAvatar'),
          dotsMenuBtn: document.getElementById('companionDotsBtn')
        });
      }
    });
  </script>
</body>
</html>
